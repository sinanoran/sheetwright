name: Release

on:
  push:
    tags: ['v*']

# id-token lets GitHub mint the OIDC token that nuget.org exchanges for a
# short-lived API key. There is no long-lived key stored anywhere for this
# repository, which is the whole point — see Trusted Publishing below.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the version. There is no version in a file to forget to bump,
      # and no way for the tag and the package to disagree.
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore Sheetwright.slnx

      - run: dotnet build Sheetwright.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - run: dotnet test Sheetwright.slnx --no-build --configuration Release

      - run: dotnet pack src/Sheetwright/Sheetwright.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.value }} --output artifacts

      # Deliberately the last thing before the push: the key nuget.org issues is
      # valid for one hour, and a build that gets slower is not a reason for a
      # release to start failing.
      - name: Exchange the OIDC token for a short-lived NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
