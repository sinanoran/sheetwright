name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The tag is the version. There is no version in a file to forget to bump,
      # and no way for the tag and the package to disagree.
      - name: Read the version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore Sheetwright.slnx

      - run: dotnet build Sheetwright.slnx --no-restore --configuration Release -p:Version=${{ steps.version.outputs.value }}

      - run: dotnet test Sheetwright.slnx --no-build --configuration Release

      - run: dotnet pack src/Sheetwright/Sheetwright.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.value }} --output artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
